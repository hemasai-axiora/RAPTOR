; RAPTOR CRM & HRMS — Production PHP 8.3-FPM Pool Configuration
; Location: /etc/php/8.3/fpm/pool.d/raptor.conf

[raptor]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-raptor.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Management tuned for t3.small (2 vCPU, 2 GiB RAM, ~100 Users)
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

; Memory & Execution Limits
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-raptor.log

; Environment Security
clear_env = no
