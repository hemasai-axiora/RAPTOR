# RAPTOR CRM & HRMS — Production Nginx Virtual Host Configuration
# Document Root: /var/www/raptor/current/public

server {
    listen 80;
    listen [::]:80;
    server_name ags.raptor.unaux.com axiora.raptor.unaux.com raptor.unaux.com 98.94.227.211 raptor.local _;

    root /var/www/raptor/current/public;
    index index.php index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Performance & Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Block access to hidden & sensitive files (.env, .git, .htaccess, backup files)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(sql|bak|log|ini|sh|yml|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to PHP-FPM 8.3 UNIX socket
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm-raptor.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Buffer & Upload Settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    client_max_body_size 64M;
    error_log  /var/log/nginx/raptor_error.log warn;
    access_log /var/log/nginx/raptor_access.log;
}
