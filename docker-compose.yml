version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: raptor-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RaptorRoot@2026!
      MYSQL_DATABASE: raptor_crm_db
      MYSQL_USER: raptor_user
      MYSQL_PASSWORD: RaptorProd@2026!
    ports:
      - "3307:3306"
    volumes:
      - raptor_db_data:/var/lib/mysql
      - ./dashboard_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  web:
    build: .
    container_name: raptor-web
    restart: always
    ports:
      - "8080:8000"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: raptor_user
      DB_PASS: RaptorProd@2026!
      DB_NAME: raptor_crm_db
    depends_on:
      - db

volumes:
  raptor_db_data:
