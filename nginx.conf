server {
    listen 80;
    listen [::]:80;
    server_name ags.raptor.unaux.com axiora.raptor.unaux.com raptor.unaux.com 98.94.227.211 _;

    client_max_body_size 64M;

    # ACME Challenge for Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/raptor/shared/acme;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ags.raptor.unaux.com axiora.raptor.unaux.com raptor.unaux.com 98.94.227.211 _;

    client_max_body_size 64M;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/ags.raptor.unaux.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ags.raptor.unaux.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Proxy all requests to PHP container
    location / {
        proxy_pass         http://raptor-web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
